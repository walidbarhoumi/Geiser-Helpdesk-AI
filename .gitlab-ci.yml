# ══════════════════════════════════════════════════════════════════════════════
# GEISER Helpdesk AI — GitLab CI/CD Pipeline Configuration
# Project: https://gitlab.com/geiser-group1/Geiser-Helpdesk-AI
# ══════════════════════════════════════════════════════════════════════════════

stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

# Caching to accelerate subsequent builds
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip
    - frontend/node_modules/

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1: LINT & STATIC CHECKS
# ─────────────────────────────────────────────────────────────────────────────

lint:backend:
  stage: lint
  image: python:3.10-slim
  script:
    - echo "🔍 Verifying Python syntax across all backend modules..."
    - python -m compileall backend

lint:frontend:
  stage: lint
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit
  script:
    - echo "🔍 Checking frontend TypeScript compilation..."
    - npx tsc --noEmit

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2: AUTOMATED TESTING
# ─────────────────────────────────────────────────────────────────────────────

test:backend-unit:
  stage: test
  image: python:3.10-slim
  variables:
    MONGO_URL: "mongodb://localhost:27017/itsm_test"
    SECRET_KEY: "geiser-ci-cd-test-super-secret-key-32chars!"
    ALGORITHM: "HS256"
    ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ENVIRONMENT: "test"
  before_script:
    - pip install --upgrade pip
    # Install CPU-only wheels for torch/sentence-transformers to prevent huge GPU wheel downloads
    - pip install --no-cache-dir -r backend/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
  script:
    - echo "🧪 Running ITIL Matrix, SLA, JWT, CSAT and Security test suites..."
    - cd backend
    - pytest test_itil_priority.py -v --tb=short
    - pytest test_jwt_blacklist.py -v --tb=short
    - pytest test_sla_service.py -v --tb=short
    - pytest test_csat_feature.py -v --tb=short
    - pytest test_attachments_security.py -v --tb=short

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3: APPLICATION BUILD
# ─────────────────────────────────────────────────────────────────────────────

build:frontend:
  stage: build
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci --prefer-offline --no-audit
  script:
    - echo "📦 Building React Production Bundle (Vite)..."
    - npm run build
  artifacts:
    name: "geiser-frontend-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - frontend/dist/
    expire_in: 7 days
